name: Nightly Health Check

# Runs the agreement rules in the database — the ones that must return zero —
# and writes what they find to health_check_results, which the app reads.
# A critical failure also raises a Development task, so a wrong figure lands on
# the pending list overnight instead of waiting to be noticed on a screen.
on:
  schedule:
    - cron: '30 22 * * *'   # 04:00 IST, after the day's entries are in
  workflow_dispatch:

jobs:
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Run the checks
        run: |
          python3 - << 'PYEOF'
          import subprocess, json, os, sys
          MGMT = os.environ["SUPABASE_MGMT_TOKEN"]
          REF  = "kjliulgpipqqwptinrrd"

          def run(sql):
              with open("/tmp/q.json", "w") as f:
                  json.dump({"query": sql}, f)
              r = subprocess.run(["curl", "-s", "-X", "POST",
                  f"https://api.supabase.com/v1/projects/{REF}/database/query",
                  "-H", f"Authorization: Bearer {MGMT}",
                  "-H", "Content-Type: application/json",
                  "--data-binary", "@/tmp/q.json"], capture_output=True, text=True)
              try:
                  return json.loads(r.stdout)
              except Exception:
                  print("Unreadable reply:", r.stdout[:400]); sys.exit(1)

          out = run("SELECT * FROM public.fn_run_health_checks()")
          if isinstance(out, dict) and out.get("message"):
              print("FAILED:", out["message"]); sys.exit(1)

          rows = run("""
            SELECT title, module, severity, failed_count, COALESCE(detail,'') AS detail
            FROM public.health_check_results
            WHERE run_at = (SELECT max(run_at) FROM public.health_check_results)
            ORDER BY CASE severity WHEN 'critical' THEN 1 WHEN 'warning' THEN 2 ELSE 3 END, title
          """)

          bad = [r for r in rows if r["failed_count"] > 0]
          print(f"{len(rows)} rules ran, {len(bad)} found something\n")
          for r in rows:
              mark = "FAIL" if r["failed_count"] else "ok  "
              print(f"{mark} [{r['severity']:8}] {r['module']:10} {r['title']}: {r['failed_count']}")
              if r["failed_count"] and r["detail"]:
                  print(f"       {r['detail'][:300]}")

          # A critical failure fails the run, so the red cross is visible in the
          # Actions list without having to open the log.
          crit = [r for r in bad if r["severity"] == "critical"]
          if crit:
              print(f"\n{len(crit)} CRITICAL rule(s) failed — a task has been raised on the Development list.")
              sys.exit(1)
          PYEOF
        env: { SUPABASE_MGMT_TOKEN: "${{ secrets.SUPABASE_MGMT_TOKEN }}" }
